services:
  postgres:
    image: postgres:16-alpine
    container_name: b2315p-postgres-dev
    environment:
      POSTGRES_DB: b2315p
      POSTGRES_USER: health_app
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - b2315p-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_app -d b2315p"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  b2315p-postgres-data:
